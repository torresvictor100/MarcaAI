name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build (sem testes)
        run: ./mvnw -B -DskipTests package

      - name: Testes + cobertura (unitários + integração com Testcontainers + gate JaCoCo >= 80%)
        run: ./mvnw -B verify
        env:
          # Sem chave real no CI: TriagemIAService cai no fallback determinístico (ADR-004).
          ANTHROPIC_API_KEY: ""

      - name: Publicar relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco

  build-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem Docker (validação, sem publicar em registry)
        run: docker build -t marcaai-backend:ci ./backend
