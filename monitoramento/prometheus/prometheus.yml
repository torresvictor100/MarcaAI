# Coleta das métricas do backend (ADR-011). A senha é o MARCAAI_METRICAS_TOKEN, gravada em
# /prometheus/token pelo comando do serviço no compose.yaml — nunca escrita neste arquivo.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: marcaai-backend
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password_file: /prometheus/token
    static_configs:
      - targets: ["backend:8080"]
