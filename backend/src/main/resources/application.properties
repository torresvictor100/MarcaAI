spring.application.name=marcaai-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/marcaai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Sem hibernate.jdbc.time_zone de propósito: as datas são LocalDateTime em colunas TIMESTAMP sem fuso e
# devem ser gravadas/lidas como estão, no fuso da JVM (TZ, horário de Brasília no compose). Forçar UTC aqui
# deslocava em 3h todo horário lido do banco (a consulta das 09:00 aparecia às 06:00).

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT assinado com par de chaves RSA (RS256, ADR-010). Sem valor padrão de propósito: sem as chaves a
# aplicação não sobe. Gerar com scripts/gerar-segredos.sh.
marcaai.jwt.private-key=${JWT_PRIVATE_KEY:}
marcaai.jwt.public-key=${JWT_PUBLIC_KEY:}
# Chave mestra (32 bytes, Base64) que cifra o CPF no banco (ADR-010). Obrigatória; perdê-la = perder os CPFs.
marcaai.cripto.chave=${MARCAAI_CRIPTO_CHAVE:}
marcaai.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

marcaai.cors.allowed-origins=${MARCAAI_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Rate limiting da API (ADR-010): requisições por minuto por usuário logado ou, sem login, por IP. Excedeu → 429.
marcaai.rate-limit.habilitado=${MARCAAI_RATE_LIMIT_HABILITADO:true}
marcaai.rate-limit.autenticado-por-minuto=${MARCAAI_RATE_LIMIT_AUTENTICADO_POR_MINUTO:300}
marcaai.rate-limit.anonimo-por-minuto=${MARCAAI_RATE_LIMIT_ANONIMO_POR_MINUTO:60}

# Roda o DemoDataSeeder na subida (dispara a triagem real pros encaminhamentos de massa V015 e confirma
# agendamento/resultado de exemplo). Desligar com MARCAAI_SEED_DEMO_AUTOMATICO=false se não for ambiente de demo.
marcaai.seed.demo-automatico=${MARCAAI_SEED_DEMO_AUTOMATICO:true}

marcaai.anthropic.api-key=${ANTHROPIC_API_KEY:}
marcaai.anthropic.model=${ANTHROPIC_MODEL:claude-haiku-4-5}
marcaai.anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
marcaai.anthropic.timeout-ms=${ANTHROPIC_TIMEOUT_MS:4000}
# Relatório de sugestões da fila (ADR-008): texto mais longo que a justificativa, então tempo-limite próprio.
marcaai.anthropic.relatorio-timeout-ms=${ANTHROPIC_RELATORIO_TIMEOUT_MS:15000}
# Resiliência da chamada à API da Anthropic (Resilience4j, ADR-010/ADR-011), uma instância para a justificativa
# da triagem (anthropic-triagem) e outra para o relatório da fila (anthropic-relatorio).
#
# Circuit Breaker, janela por contagem como no material de Resiliência: olha as últimas 10 chamadas (a partir
# de 5); com 50% de falha OU 50% de chamadas lentas, abre e fica 30s sem chamar (tudo vai direto para o
# template); depois libera 2 chamadas de teste (meio aberto). Bulkhead cheio não conta como falha da API.
resilience4j.circuitbreaker.configs.anthropic.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.anthropic.sliding-window-size=10
resilience4j.circuitbreaker.configs.anthropic.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.anthropic.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.anthropic.slow-call-rate-threshold=50
resilience4j.circuitbreaker.configs.anthropic.wait-duration-in-open-state=${ANTHROPIC_CIRCUITO_ESPERA:30s}
resilience4j.circuitbreaker.configs.anthropic.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.anthropic.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.anthropic.ignore-exceptions=io.github.resilience4j.bulkhead.BulkheadFullException
resilience4j.circuitbreaker.configs.anthropic.register-health-indicator=true
# Circuito aberto aparece no /actuator/health, mas não derruba o status geral: a IA é opcional (há template).
resilience4j.circuitbreaker.configs.anthropic.allow-health-indicator-to-fail=false
# "Chamada lenta" perto do timeout de cada uma (4s na triagem, 15s no relatório, que tem texto maior).
resilience4j.circuitbreaker.instances.anthropic-triagem.base-config=anthropic
resilience4j.circuitbreaker.instances.anthropic-triagem.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.instances.anthropic-relatorio.base-config=anthropic
resilience4j.circuitbreaker.instances.anthropic-relatorio.slow-call-duration-threshold=12s
management.health.circuitbreakers.enabled=true
#
# Retry com backoff exponencial: 1 nova tentativa depois de 500ms, só para falha transitória (429/5xx/529).
resilience4j.retry.instances.anthropic-triagem.max-attempts=2
resilience4j.retry.instances.anthropic-triagem.wait-duration=500ms
resilience4j.retry.instances.anthropic-triagem.enable-exponential-backoff=true
resilience4j.retry.instances.anthropic-triagem.exponential-backoff-multiplier=2
resilience4j.retry.instances.anthropic-triagem.retry-exceptions=com.marcaai.triagemia.AnthropicTransitorioException
resilience4j.retry.instances.anthropic-relatorio.max-attempts=2
resilience4j.retry.instances.anthropic-relatorio.wait-duration=500ms
resilience4j.retry.instances.anthropic-relatorio.enable-exponential-backoff=true
resilience4j.retry.instances.anthropic-relatorio.exponential-backoff-multiplier=2
resilience4j.retry.instances.anthropic-relatorio.retry-exceptions=com.marcaai.relatoriofila.RedacaoTransitoriaException
#
# Bulkhead (semáforo): no máximo N chamadas simultâneas; a que passar disso não espera — vai para o template.
resilience4j.bulkhead.instances.anthropic-triagem.max-concurrent-calls=${ANTHROPIC_MAX_CHAMADAS_TRIAGEM:5}
resilience4j.bulkhead.instances.anthropic-triagem.max-wait-duration=0
resilience4j.bulkhead.instances.anthropic-relatorio.max-concurrent-calls=${ANTHROPIC_MAX_CHAMADAS_RELATORIO:2}
resilience4j.bulkhead.instances.anthropic-relatorio.max-wait-duration=0
marcaai.relatorio-fila.dias-para-antecipar=${MARCAAI_RELATORIO_DIAS_PARA_ANTECIPAR:7}
marcaai.relatorio-fila.dias-espera-longa=${MARCAAI_RELATORIO_DIAS_ESPERA_LONGA:30}

# Monitoramento (ADR-011): health e info públicos; o resto só para ADMIN (regra no SecurityConfig).
# metrics = latência/erros por rota (Micrometer); circuitbreakers/retries/bulkheads = estado do Resilience4j;
# prometheus = tudo isso no formato que o Prometheus coleta (credencial própria, MARCAAI_METRICAS_TOKEN).
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents,retries,retryevents,bulkheads
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
# Histograma de latência por rota, para o p95 no Grafana.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
marcaai.metricas.token=${MARCAAI_METRICAS_TOKEN:}

# Swagger fica público por padrão (demonstração do hackathon); desligar em produção com MARCAAI_SWAGGER_HABILITADO=false.
springdoc.api-docs.enabled=${MARCAAI_SWAGGER_HABILITADO:true}
springdoc.swagger-ui.enabled=${MARCAAI_SWAGGER_HABILITADO:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# A API só responde JSON; sem isto a documentação mostraria */* nas respostas de sucesso.
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
# Swagger UI: seções e rotas na ordem do código, com o tempo de resposta e o token mantido ao recarregar a página.
springdoc.swagger-ui.tags-sorter=none
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true
